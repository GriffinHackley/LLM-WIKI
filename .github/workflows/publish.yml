name: Publish

# Publishes to PyPI when a version tag (v0.2.0, ...) is pushed. Needs, once: a license in
# pyproject.toml, and the "llm-wiki-cli" project on PyPI set up for trusted publishing from
# this repository's "pypi" environment (no token stored here).
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
