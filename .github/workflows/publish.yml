name: Publish

# Publishes to PyPI when a version tag (v0.2.0, ...) is pushed. Needs, once: the
# "llm-wiki-cli" project on PyPI set up for trusted publishing from this repository's
# "pypi" environment (no token stored here). Nothing is published unless the tests pass
# on every OS, the tag matches the package version, and the built wheel installs and runs.
on:
  push:
    tags: ["v*"]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv run --extra test pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv build
      - name: Tag matches the package version
        run: |
          version=$(ls dist/*.whl | sed -E 's/.*llm_wiki_cli-([^-]+)-.*/\1/')
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME but package $version"; exit 1; }
      - name: Metadata and README render on PyPI
        run: uvx twine check --strict dist/*
      - name: The wheel installs and runs
        run: |
          uv tool install dist/*.whl
          wiki --version
          wiki new "$RUNNER_TEMP/smoke" --agent claude
          wiki guide ingest --root "$RUNNER_TEMP/smoke" > /dev/null
          wiki check --all --root "$RUNNER_TEMP/smoke"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
