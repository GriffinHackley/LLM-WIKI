# Settings for the `wiki` command. Made by `wiki new` from the code preset; everything
# here is yours to change. See `wiki guide` for the workflows.
preset = "code"

pages = ["wiki/**/*.md"]
raw = ["raw/**/*.txt"]          # text of documents (design docs, RFCs), searched with --include-raw

# The code this wiki describes: its path from this wiki, and its origin, so a pointer to
# the wrong checkout is caught. WIKI_CODE_REPO overrides the path on another machine.
[code]
repo = "{{code_repo}}"
origin = "{{code_origin}}"

[summary]
headings = ["Summary"]

[check]
summary_types = ["file", "module", "concept", "decision", "instruction", "ticket", "pr", "dependency", "gotcha",
                 "analysis"]

[suggest]
named_types = ["module", "concept", "dependency"]

# Weekly notes: `wiki weekly` writes one per finished week from the git history, and a
# timeline, in weekly/ (kept apart from the pages: not searched, not in the graph). The
# pre-commit hook writes last week's on the first commit of a new week.
[weekly]
folder = "weekly"
template = "templates/weekly.md"
group_by = "module"             # "where the work went" by module; or "type"

# Page types. A page's type comes from its `type:` frontmatter, else from its folder.
# `wiki check` warns when a page lacks one of its type's `sections` or frontmatter `fields`,
# or when a field listed under `values` holds something else.
# A document from `raw/` (a design doc, an exported ticket, a postmortem) is recorded on
# a page of the type it is: an RFC as a decision, a Jira export as a ticket.
[types.file]
description = "One source file: what it is for and what it contains, mirroring the code's own layout."
folder = "wiki/files"
template = "templates/file.md"
sections = ["Summary", "Part of"]
fields = ["title", "type", "last_updated"]

[types.module]
description = "One area of the code with one job, usually a folder: what it does, where it lives, and how it fits with the rest. An area inside it with a job of its own gets its own module page, nested under it."
folder = "wiki/modules"
template = "templates/module.md"
hub = true                      # other pages gather around it (wiki clusters)
sections = ["Summary"]
fields = ["title", "type", "last_updated"]

[types.concept]
description = "An idea from the code: a domain term, pattern, interface or piece of configuration it relies on."
folder = "wiki/concepts"
template = "templates/concept.md"
hub = true                      # other pages gather around it (wiki clusters)
sections = ["Summary"]
fields = ["title", "type", "last_updated"]

[types.decision]
description = "Why something is the way it is: the context, the choice, and its consequences (like an ADR)."
folder = "wiki/decisions"
template = "templates/decision.md"
sections = ["Summary", "Decision"]
fields = ["title", "type", "status", "last_updated"]
values = { status = ["proposed", "accepted", "rejected", "superseded", "deprecated"] }

[types.instruction]
description = "How to do a specific task: set up a dev environment, run, test, deploy, debug or backport."
folder = "wiki/instructions"
template = "templates/instruction.md"
sections = ["Summary"]
fields = ["title", "type", "last_updated"]

[types.ticket]
description = "A tracker ticket (a Jira story, bug or task): what it asked for, and what was done. Its epic goes in `parent:`."
folder = "wiki/tickets"
template = "templates/ticket.md"
record = true                   # lives in the tracker: cited by key and url, rechecked by `wiki stale`
sections = ["Summary"]
fields = ["title", "type", "kind", "last_updated"]
values = { kind = ["story", "bug", "task"] }

[types.epic]
description = "A tracker epic: a feature being built, what it asks for, and the tickets, pull requests and code that deliver it."
folder = "wiki/epics"
template = "templates/epic.md"
record = true                   # lives in the tracker, like a ticket
hub = true                      # its tickets and pull requests gather around it (wiki clusters)
no_links_with = ["file"]        # epics and file pages don't link each other: a file links its ticket,
                                # an epic the module (wiki check warns)
sections = ["Summary"]
fields = ["title", "type", "last_updated"]

[types.pr]
description = "A pull request: its description, an overview of the changes, and the commit it merged as."
folder = "wiki/prs"
template = "templates/pr.md"
sections = ["Summary", "Changes"]
fields = ["title", "type", "merge_commit", "last_updated"]

[types.dependency]
description = "An external library or service the code uses: why, how, and what to watch for."
folder = "wiki/dependencies"
template = "templates/dependency.md"
sections = ["Summary"]
fields = ["title", "type", "last_updated"]

[types.gotcha]
description = "A trap in the code: what goes wrong, why, and how to avoid it."
folder = "wiki/gotchas"
template = "templates/gotcha.md"
sections = ["Summary", "Cause", "Avoid"]
fields = ["title", "type", "last_updated"]

[types.analysis]
description = "The wiki's own synthesis: a page answering a question by drawing on many other pages."
folder = "wiki/analyses"
template = "templates/analysis.md"
sections = ["Summary", "Key pages"]
fields = ["title", "type", "last_updated"]

# Typed relations: links under these headings get a relation type, and the rest of the
# list line becomes the reason. `code:` links are `refers-to-code`; every other link is
# `links-to`.
[[relations]]
heading = "Depends on"
page_type = "module"
type = "depends-on"
inverse = "used-by"

[[relations]]
heading = "Affects"
page_type = "decision"
type = "decided-for"
inverse = "decided-in"

[[relations]]
heading = "Key pages"
page_type = "analysis"
type = "synthesizes"
inverse = "synthesized-in"

[[relations]]
heading = "Part of"
page_type = "file"
type = "part-of"
inverse = "has-part"

# A module inside a larger one (wiki/modules/parser.md inside wiki/modules/core.md): files
# name the specific module, and the larger one stays an overview of its parts.
[[relations]]
heading = "Part of"
page_type = "module"
type = "part-of"
inverse = "has-part"

[[relations]]
heading = "Implements"
page_type = "pr"
type = "implements"
inverse = "implemented-by"

[[relations]]
heading = "Affects"
page_type = "gotcha"
type = "gotcha-for"
inverse = "has-gotcha"

[[relations]]
field = "parent"
page_type = "ticket"
type = "child-of"
inverse = "parent-of"

[[relations]]
field = "sources"
type = "draws-on"
inverse = "drawn-on-by"
