[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "wiki-cli"
version = "0.1.0"
description = "Read-side tooling for llm-wiki: typed relations, search, and guided traversal."
requires-python = ">=3.13"
dependencies = [
    "PyYAML>=6",
    "sqlite-vec>=0.1.9",
    # Pinned: fastembed versions pin which model files are downloaded. It is used only to
    # download; models.py runs the files with onnxruntime and tokenizers, matching 0.8.1.
    "fastembed==0.8.1",
    "onnxruntime>=1.20",
    "tokenizers>=0.20",
    "numpy>=2",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
wiki = "wiki_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wiki_cli = ["guides/**/*.md", "presets/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
