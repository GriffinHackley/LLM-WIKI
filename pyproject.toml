[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-wiki-cli"
dynamic = ["version"]
description = "Start and run an LLM-maintained wiki with any agent: presets, workflow guides, search, typed relations and guided navigation."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE", "src/wiki_cli/map/3d-force-graph.LICENSE"]
authors = [{ name = "Griffin Hackley" }]
keywords = ["wiki", "llm", "agents", "knowledge-base", "obsidian", "markdown", "search", "claude", "codex"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "PyYAML>=6",
    "sqlite-vec>=0.1.9",
    # Pinned: fastembed versions pin which model files are downloaded. It is used only to
    # download; models.py runs the files with onnxruntime and tokenizers, matching 0.8.1.
    "fastembed==0.8.1",
    "onnxruntime>=1.20",
    "tokenizers>=0.20",
    "numpy>=2",
    "networkx>=3.2",                # Louvain communities for wiki clusters
    "umap-learn>=0.5.7",            # 3D layout for wiki map; imported only by that command
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/GriffinHackley/LLM-WIKI"
Documentation = "https://github.com/GriffinHackley/LLM-WIKI/blob/main/docs/getting-started.md"
Issues = "https://github.com/GriffinHackley/LLM-WIKI/issues"
Changelog = "https://github.com/GriffinHackley/LLM-WIKI/blob/main/CHANGELOG.md"

[project.scripts]
wiki = "wiki_cli.cli:main"

[tool.setuptools.dynamic]
version = { attr = "wiki_cli.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wiki_cli = ["guides/**/*.md", "presets/**/*", "hooks/*", "map/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
